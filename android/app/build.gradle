plugins { id 'com.android.application' }

android {
    namespace 'lat.animetrix.app'
    compileSdk 35

    defaultConfig {
        applicationId 'lat.animetrix.app'
        minSdk 24
        targetSdk 35
        versionCode (System.getenv('VERSION_CODE') ?: '1') as int
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    // La firma se lee de variables de entorno (secretos de GitHub). Nunca va en el repositorio.
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError false }
}
