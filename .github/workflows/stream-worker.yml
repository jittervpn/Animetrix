name: Instalar reproductor de Cloudflare (videos de Telegram)

# Instala (o actualiza) el Cloudflare Worker que sirve los videos guardados en tu canal de Telegram.
# Necesita un solo secreto en GitHub: CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare Workers").
# El token del bot lo pide a tu API con el token OIDC de GitHub (no se guarda en el repo) y, al terminar,
# le avisa a tu API la dirección del reproductor.
on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Dirección de AnimetrixLat'
        required: true
        default: 'https://animetrixlat.vercel.app'
  push:
    branches: [main]
    paths: ['cloudflare/stream/**', '.github/workflows/stream-worker.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: stream-worker
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API: ${{ inputs.api || 'https://animetrixlat.vercel.app' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: cloudflare/stream

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Revisar el token de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Pedir el token del bot a tu API
        run: |
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=animetrixlat" | jq -r .value)
          resp=$(curl -sS -X POST -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' -d '{}' "$API/api/bot?gh=worker")
          tok=$(echo "$resp" | jq -r '.token // empty')
          if [ -z "$tok" ]; then echo "::error::Tu API no dio el token del bot: $(echo "$resp" | jq -r '.error // .')"; exit 1; fi
          echo "::add-mask::$tok"
          echo "BOT_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Instalar el Worker
        working-directory: cloudflare/stream
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log || {
            if grep -qi "workers.dev subdomain\|register a workers.dev" /tmp/deploy.log; then
              echo "::error::Abrí Cloudflare → Workers & Pages una vez para crear tu subdominio workers.dev y volvé a correr este flujo."
            fi
            exit 1
          }
          printf '%s' "$BOT_TOKEN" | npx --yes wrangler@4 secret put BOT_TOKEN
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::No encontré la dirección del Worker en la salida de wrangler."; exit 1; fi
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
          echo "Worker: $url"

      - name: Probar el Worker y avisarle a tu API
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -fsS "$WORKER_URL/salud" || true)
            echo "$out"
            case "$out" in *ok*) break;; esac
            sleep 5
          done
          case "$out" in *ok*) ;; *) echo "::error::El Worker no responde bien."; exit 1;; esac
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=animetrixlat" | jq -r .value)
          curl -fsS -X POST -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            -d "{\"url\":\"$WORKER_URL\"}" "$API/api/bot?gh=stream"
