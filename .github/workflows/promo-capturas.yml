name: Capturas promo (temporal)
on:
  push:
    branches: [promo-capturas]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Capturar
        working-directory: promo
        run: |
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node capture.mjs
      - name: Guardar en rama promo-capturas-out
        run: |
          cd promo/out && git init -q && git checkout -q -b promo-capturas-out
          git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "capturas"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" promo-capturas-out
