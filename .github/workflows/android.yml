name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # solo para publicar el APK en "Releases"

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            {
              echo "ANDROID_KEYSTORE_PATH=$KS"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
              echo "SIGNING=permanente"
            } >> "$GITHUB_ENV"
          else
            TMP_PASS=$(openssl rand -hex 24)
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -keystore "$KS" -alias tmp -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$TMP_PASS" -keypass "$TMP_PASS" -dname "CN=Animetrix temporal" >/dev/null
            {
              echo "ANDROID_KEYSTORE_PATH=$KS"
              echo "ANDROID_KEYSTORE_PASSWORD=$TMP_PASS"
              echo "ANDROID_KEY_ALIAS=tmp"
              echo "ANDROID_KEY_PASSWORD=$TMP_PASS"
              echo "SIGNING=temporal"
            } >> "$GITHUB_ENV"
            echo "::warning::Sin clave de firma permanente: el APK se firmó con una clave temporal (instalable, pero las actualizaciones pedirán desinstalar)."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Animetrix-v1.0.${{ github.run_number }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256.txt
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Animetrix-APK
          path: dist/
          retention-days: 30

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk dist/SHA256.txt \
            --title "Animetrix para Android v1.0.${{ github.run_number }}" \
            --notes "APK de Animetrix (firma: ${SIGNING}). Instálalo en Android 7.0 o superior." \
            --latest
