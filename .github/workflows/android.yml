name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # solo para publicar el APK en "Releases"

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar firma
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$SIGNING_KEY" ]; then
            # Clave permanente: el archivo va cifrado (AES-256) en el repo; solo el secreto lo abre.
            printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/k"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/signing/release.jks.enc -out "$KS" -pass file:"$RUNNER_TEMP/k"
            rm -f "$RUNNER_TEMP/k"
            {
              echo "ANDROID_KEYSTORE_PATH=$KS"
              echo "ANDROID_KEYSTORE_PASSWORD=$SIGNING_KEY"
              echo "ANDROID_KEY_ALIAS=animetrix"
              echo "ANDROID_KEY_PASSWORD=$SIGNING_KEY"
              echo "SIGNING=permanente"
            } >> "$GITHUB_ENV"
          else
            TMP_PASS=$(openssl rand -hex 24)
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -keystore "$KS" -alias tmp -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$TMP_PASS" -keypass "$TMP_PASS" -dname "CN=Animetrix temporal" >/dev/null
            {
              echo "ANDROID_KEYSTORE_PATH=$KS"
              echo "ANDROID_KEYSTORE_PASSWORD=$TMP_PASS"
              echo "ANDROID_KEY_ALIAS=tmp"
              echo "ANDROID_KEY_PASSWORD=$TMP_PASS"
              echo "SIGNING=temporal"
            } >> "$GITHUB_ENV"
            echo "::warning::Falta el secreto ANDROID_SIGNING_KEY: el APK se firmó con una clave temporal."
          fi

      - name: Leer App ID de AdMob (panel /admin)
        env:
          FALLBACK: ${{ vars.ADMOB_APP_ID }}
        run: |
          ID=$(curl -fsS --max-time 20 https://www.animetrix.lat/api/app-config | jq -r '.ads.appId // empty' || true)
          [ -z "$ID" ] && ID="$FALLBACK"
          if printf '%s' "$ID" | grep -Eq '^ca-app-pub-[0-9]{10,20}~[0-9]{6,14}$'; then
            echo "ADMOB_APP_ID=$ID" >> "$GITHUB_ENV"
            echo "App ID de AdMob: $ID"
          else
            echo "::warning::No hay App ID de AdMob en el panel: el APK usa el ID de prueba de Google."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.2.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Animetrix-v1.2.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk dist/Animetrix.apk
          sha256sum dist/*.apk | tee dist/SHA256.txt
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Animetrix-APK
          path: dist/
          retention-days: 30

      - name: Publicar en Releases
        if: env.SIGNING == 'permanente'   # solo se publican APK con la firma oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v1.2.${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk dist/SHA256.txt \
            --title "Animetrix para Android v1.2.${{ github.run_number }}" \
            --notes "APK de Animetrix (firma: ${SIGNING}). Instálalo en Android 7.0 o superior." \
            --latest
